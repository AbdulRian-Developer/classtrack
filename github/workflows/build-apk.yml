name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Prepare Android project
        run: |
          cp node_modules/@capacitor/core/dist/capacitor.js www/vendor/capacitor.js
          npx cap add android
          node scripts/customize-android.mjs
          npx cap sync android

      - name: Use Play Store upload key (only if the secret is set)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "CT_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "CT_STORE_PASS=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "CT_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "CT_KEY_PASS=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build APK and Play Store bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Collect files
        id: out
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME="ClassTrack-v${VERSION}-build${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/${NAME}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/${NAME}.aab"
          ls -la dist
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-build${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.out.outputs.name }}
          path: dist/*

      - name: Publish release (download the APK from the Releases page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.out.outputs.tag }}
          name: ClassTrack ${{ steps.out.outputs.tag }}
          make_latest: true
          body: |
            Install on Android: download **${{ steps.out.outputs.name }}.apk** below and open it.
            The `.aab` file is only needed for uploading to the Google Play Store.
          files: |
            dist/${{ steps.out.outputs.name }}.apk
            dist/${{ steps.out.outputs.name }}.aab
